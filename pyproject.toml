[project]
name = "hatari"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "pre-commit",
]

[tool.ruff.lint]
preview = true
select = [
    "correctness",
    "suspicious",
    "complexity",
    "performance",
    "style",
    "security",  # payments code: accept some noise
    "I",         # import sorting (the formatter doesn't do this)
    "ASYNC",     # asyncio pitfalls
    "DTZ",       # naive datetimes
    "BLE001",    # blind `except Exception`
    "T201",      # no print() in library code
    "RUF100",    # unused suppression comments
]
ignore = [
    "S311",  # seeded random.Random is intentional: reproducible fault plans
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "T201"]  # fake secrets and prints are fine in tests

[tool.ruff.format]
docstring-code-format = true
